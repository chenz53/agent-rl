[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoastra"
version = "0.1.0"
description = "Learning clinical agent reinforcement learning on verl"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
# Local CPU import/demo dependencies only; NOT a GPU training environment.
cpu = [
  "torch>=2.9,<3",
  "tensordict>=0.8,<=0.10,!=0.9",
  "transformers>=5.5.3,!=5.6.0,<5.13",
  "ray>=2.41",
  "numpy>=2",
  "pydantic>=2,<3",
  "packaging>=20",
  "hydra-core>=1.3,<2",
  "codetiming>=1.4",
  "pandas>=2",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
