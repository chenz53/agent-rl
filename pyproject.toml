[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrl"
version = "0.1.0"
description = "Functions built in the book Agentic RL: From Policy Gradients to Coding Agents (generated from tutorial #@save blocks)"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
# Only the real-model thread (chat templates, Qwen3-0.6B) needs transformers.
real = ["transformers>=4.51"]

[tool.setuptools]
packages = ["agentrl"]
