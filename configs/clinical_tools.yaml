tools:
  - class_name: nanoastra.verl_tool.ClinicalRecordTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: get_clinical_record
        description: Read one available field from the current synthetic case.
        parameters:
          type: object
          properties:
            field:
              type: string
              description: The record field to retrieve.
              enum: [exposure, test_x]
          required: [field]
