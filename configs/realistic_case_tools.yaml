tools:
  - class_name: nanoastra.verl_tool.ClinicalRecordTool
    config:
      type: native
      record_fields: [history_present_illness, risk_history, medications_allergies, focused_exam, initial_labs, ecg, chest_xray, d_dimer, ctpa_report, leg_ultrasound, microbiology]
    tool_schema:
      type: function
      function:
        name: get_clinical_record
        description: Read one record field at the current replay time; cannot order tests or advance time.
        parameters:
          type: object
          properties:
            field:
              type: string
              description: Clinical record section to retrieve; a pending report is not a negative result.
              enum: [history_present_illness, risk_history, medications_allergies, focused_exam, initial_labs, ecg, chest_xray, d_dimer, ctpa_report, leg_ultrasound, microbiology]
          required: [field]
