<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Per-GPU memory of one RL microbatch: Qwen3-8B, 32k tokens, FSDP over 8 GPUs">
<style>
svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--neutral:#f0efec;--panel:#f4f3ef;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--neutral:#383835;--panel:#232322;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}
.bg{fill:var(--surface)} .t{fill:var(--ink)} .t2{fill:var(--ink2)} .m{fill:var(--muted)}
.title{font-size:15px;font-weight:600;fill:var(--ink)} .sub{font-size:12px;fill:var(--ink2)}
.lab{font-size:12px;fill:var(--ink2)} .tick{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--axis);stroke-width:1}
.box{fill:var(--panel);stroke:var(--axis);stroke-width:1} .edge{stroke:var(--ink2);stroke-width:1.5;fill:none}
.ring{stroke:var(--surface);stroke-width:2} .note{font-size:11px;fill:var(--ink2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker></defs>
<rect class="bg" width="1000" height="360" rx="8"/>
<text class="title" x="20" y="30">Per-GPU memory of one RL microbatch: Qwen3-8B, 32k tokens, FSDP over 8 GPUs</text>
<text class="sub" x="20" y="48">Arithmetic, not a measurement. Logit bytes per element (12 full, 4.5 stored when chunked) are taken from the Section 14.3 measurement on Qwen3-0.6B.</text>
<text class="t2" x="200" y="131.0" font-size="12" text-anchor="end">full logits</text>
<rect x="210.0" y="110" width="12.3" height="34" fill="var(--s1)" stroke="var(--surface)" stroke-width="1"><title>parameters (bf16): 2.0 GB</title></rect>
<rect x="222.3" y="110" width="24.6" height="34" fill="var(--s2)" stroke="var(--surface)" stroke-width="1"><title>gradients (fp32): 4.1 GB</title></rect>
<rect x="246.9" y="110" width="73.8" height="34" fill="var(--s3)" stroke="var(--surface)" stroke-width="1"><title>Adam + master (fp32): 12.3 GB</title></rect>
<rect x="320.7" y="110" width="70.9" height="34" fill="var(--s4)" stroke="var(--surface)" stroke-width="1"><title>activations (checkpointed): 11.8 GB</title></rect>
<rect x="391.6" y="110" width="358.5" height="34" fill="var(--s5)" stroke="var(--surface)" stroke-width="1"><title>logits: 59.7 GB</title></rect>
<text class="t" x="758.02895744" y="131.0" font-size="12" text-anchor="start">90 GB (logits 59.7)</text>
<text class="t2" x="200" y="191.0" font-size="12" text-anchor="end">chunked</text>
<rect x="210.0" y="170" width="12.3" height="34" fill="var(--s1)" stroke="var(--surface)" stroke-width="1"><title>parameters (bf16): 2.0 GB</title></rect>
<rect x="222.3" y="170" width="24.6" height="34" fill="var(--s2)" stroke="var(--surface)" stroke-width="1"><title>gradients (fp32): 4.1 GB</title></rect>
<rect x="246.9" y="170" width="73.8" height="34" fill="var(--s3)" stroke="var(--surface)" stroke-width="1"><title>Adam + master (fp32): 12.3 GB</title></rect>
<rect x="320.7" y="170" width="70.9" height="34" fill="var(--s4)" stroke="var(--surface)" stroke-width="1"><title>activations (checkpointed): 11.8 GB</title></rect>
<rect x="391.6" y="170" width="145.6" height="34" fill="var(--s5)" stroke="var(--surface)" stroke-width="1"><title>logits: 24.3 GB</title></rect>
<text class="t" x="545.1921466880001" y="191.0" font-size="12" text-anchor="start">55 GB (logits 24.3)</text>
<text class="t2" x="200" y="251.0" font-size="12" text-anchor="end">chunked + recompute</text>
<rect x="210.0" y="230" width="12.3" height="34" fill="var(--s1)" stroke="var(--surface)" stroke-width="1"><title>parameters (bf16): 2.0 GB</title></rect>
<rect x="222.3" y="230" width="24.6" height="34" fill="var(--s2)" stroke="var(--surface)" stroke-width="1"><title>gradients (fp32): 4.1 GB</title></rect>
<rect x="246.9" y="230" width="73.8" height="34" fill="var(--s3)" stroke="var(--surface)" stroke-width="1"><title>Adam + master (fp32): 12.3 GB</title></rect>
<rect x="320.7" y="230" width="70.9" height="34" fill="var(--s4)" stroke="var(--surface)" stroke-width="1"><title>activations (checkpointed): 11.8 GB</title></rect>
<rect x="391.6" y="230" width="11.2" height="34" fill="var(--s5)" stroke="var(--surface)" stroke-width="1"><title>logits: 1.9 GB</title></rect>
<text class="t" x="410.768897792" y="251.0" font-size="12" text-anchor="start">32 GB (logits 1.9)</text>
