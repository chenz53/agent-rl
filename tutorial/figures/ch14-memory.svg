<text class="m" x="930.0" y="286" font-size="10" text-anchor="middle">120 GB</text>
<rect x="42" y="320" width="12" height="12" rx="3" fill="var(--s1)"/>
<text class="t2" x="64" y="330" font-size="12" text-anchor="start">parameters</text>
<rect x="154" y="320" width="12" height="12" rx="3" fill="var(--s2)"/>
<text class="t2" x="176" y="330" font-size="12" text-anchor="start">gradients</text>
