e">+0.305</text><rect class="card-soft" x="764.0" y="300.0" width="106.0" height="36.0" rx="8"></rect><text class="vpos" x="817.0" y="323.0" text-anchor="middle">+0.305</text><text class="desc" x="902.0" y="215.0" text-anchor="start">V(end) = 0</text><text class="desc" x="190.0" y="380.0" text-anchor="start">Token-level GAE on the same episode varies within each call: +0.08..+0.13,  +0.23..+0.40,  +0.19..+0.35,  +0.09..+0.29</text><text class="desc" x="190.0" y="400.0" text-anchor="start">δ_k = r_k + V(s_k+1) − V(s_k);  A_k = δ_k + λ · A_k+1.  Accent: positive; ink: negative.</text></svg>