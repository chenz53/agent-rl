<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 694" width="1180" height="694" role="img" aria-label="Triage map"><style>
svg{--plate:#fcfcfb;--hi:#18181b;--mid:#71717a;--lo:#d4d4d8;--accent:#2a78d6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: dark){svg{--plate:#111113;--hi:#fafafa;--mid:#a1a1aa;--lo:#3f3f46;--accent:#3987e5}}
.plate{fill:var(--plate)}
.sil{fill:var(--plate);stroke:var(--hi);stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.crease{fill:none;stroke:var(--mid);stroke-width:.9;stroke-linecap:round;opacity:.75;vector-effect:non-scaling-stroke}
.floor{fill:var(--lo)}
.guide{fill:none;stroke:var(--lo);stroke-width:.9;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
.track{fill:none;stroke:var(--mid);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.accent{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pulse{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:10 400;
  animation:flow 3.2s linear infinite}
@keyframes flow{from{stroke-dashoffset:410}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none;stroke-dasharray:none;opacity:0}}
.leader{fill:none;stroke:var(--mid);stroke-width:.7;vector-effect:non-scaling-stroke}
.dot{fill:var(--hi)}
.num{fill:var(--mid);font-size:10px;letter-spacing:.08em}
.name{fill:var(--hi);font-size:12px;font-weight:600;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.desc{fill:var(--mid);font-size:11px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.cap{fill:var(--mid);font-size:10px;letter-spacing:.14em}
.read{fill:var(--hi);font-size:11px}
.tlabel{fill:var(--mid);font-size:10px}
.cell{fill:var(--plate);stroke:var(--mid);stroke-width:.9}
.cell-prompt{fill:var(--plate);stroke:var(--mid);stroke-width:.9;stroke-dasharray:1.5 2.5}
.cell-policy{fill:var(--plate);stroke:var(--accent);stroke-width:1.4}
.cell-reward{fill:var(--plate);stroke:var(--hi);stroke-width:.9}
.ctext{fill:var(--hi);font-size:11px}
.mask{fill:var(--mid);font-size:10px}
.mask1{fill:var(--accent);font-size:10px;font-weight:600}
.card{fill:var(--plate);stroke:var(--hi);stroke-width:.9}
.card-soft{fill:var(--plate);stroke:var(--mid);stroke-width:.9}
.card-accent{fill:var(--plate);stroke:var(--accent);stroke-width:1.4}
.card-dot{fill:var(--plate);stroke:var(--mid);stroke-width:.9;stroke-dasharray:1.5 2.5}
.ctitle{fill:var(--hi);font-size:12px;font-weight:600;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.cline{fill:var(--mid);font-size:11px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.cmono{fill:var(--hi);font-size:11px}
.chead{fill:var(--mid);font-size:10px;letter-spacing:.12em}
.vpos{fill:var(--accent);font-size:13px;font-weight:600}
.vneg{fill:var(--hi);font-size:13px;font-weight:600}
.vzero{fill:var(--mid);font-size:13px}
.ttemplate{fill:var(--mid);font-size:10px}
.readk{fill:var(--mid);font-size:11px}
</style><rect class="plate" width="1180" height="694" rx="10"/>
<text class="cap" x="24" y="34" text-anchor="start">FIG 18.3 · TRIAGE: FROM A DASHBOARD SYMPTOM TO THE TEST THAT DECIDES IT</text><text class="readk" x="24" y="50" text-anchor="start">run the cheap invariants of Section 18.6 first; numbers refer to the chapter&#x27;s catalogue of faults</text><text class="chead" x="38.0" y="100.0" text-anchor="start">SYMPTOM</text><text class="chead" x="448.0" y="100.0" text-anchor="start">FIRST TEST</text><text class="chead" x="848.0" y="100.0" text-anchor="start">LIKELY FAULT</text><rect class="card-soft" x="24.0" y="112.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="132.5" text-anchor="middle"><tspan class="ctitle">logp_gap above ~1e-4</tspan></text><text class="cline" x="204.0" y="147.5" text-anchor="middle">sampler vs trainer log-probs on the loss mask</text><rect class="card-accent" x="434.0" y="112.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="140.0" text-anchor="middle"><tspan class="ctitle">sampler = trainer logp; mask = policy</tspan></text><rect class="card" x="834.0" y="112.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="132.5" text-anchor="middle"><tspan class="ctitle">(1) mask off by one, (9) temperature</tspan></text><text class="cline" x="995.0" y="147.5" text-anchor="middle">retokenization drift (Ch. 5), engine mismatch (Ch. 13)</text><path class="track" d="M388.0,136.0 L428.0,136.0"/><path class="track" d="M421.7,139.0 L428.0,136.0 L421.7,133.0"/><path class="track" d="M768.0,136.0 L828.0,136.0"/><path class="track" d="M821.7,139.0 L828.0,136.0 L821.7,133.0"/><rect class="card-soft" x="24.0" y="174.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="194.5" text-anchor="middle"><tspan class="ctitle">clip_frac = 0, ratio exactly 1</tspan></text><text class="cline" x="204.0" y="209.5" text-anchor="middle">with minibatches &gt; 1 or epochs &gt; 1</text><rect class="card-accent" x="434.0" y="174.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="202.0" text-anchor="middle"><tspan class="ctitle">old_logp frozen in the update</tspan></text><rect class="card" x="834.0" y="174.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="194.5" text-anchor="middle"><tspan class="ctitle">(2) stale old_logp</tspan></text><text class="cline" x="995.0" y="209.5" text-anchor="middle">old log-probs recomputed inside the loop</text><path class="track" d="M388.0,198.0 L428.0,198.0"/><path class="track" d="M421.7,201.0 L428.0,198.0 L421.7,195.0"/><path class="track" d="M768.0,198.0 L828.0,198.0"/><path class="track" d="M821.7,201.0 L828.0,198.0 L821.7,195.0"/><rect class="card-soft" x="24.0" y="236.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="256.5" text-anchor="middle"><tspan class="ctitle">reward falls from step 0</tspan></text><text class="cline" x="204.0" y="271.5" text-anchor="middle">turns rise, exploit and junk calls rise</text><rect class="card-accent" x="434.0" y="236.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="264.0" text-anchor="middle"><tspan class="ctitle">update follows the sign of A</tspan></text><rect class="card" x="834.0" y="236.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="256.5" text-anchor="middle"><tspan class="ctitle">(5) sign error</tspan></text><text class="cline" x="995.0" y="271.5" text-anchor="middle">in the advantage, the loss, or the reward</text><path class="track" d="M388.0,260.0 L428.0,260.0"/><path class="track" d="M421.7,263.0 L428.0,260.0 L421.7,257.0"/><path class="track" d="M768.0,260.0 L828.0,260.0"/><path class="track" d="M821.7,263.0 L828.0,260.0 L821.7,257.0"/><rect class="card-soft" x="24.0" y="298.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="318.5" text-anchor="middle"><tspan class="ctitle">approx_kl &gt;&gt; 0.01, entropy jumps</tspan></text><text class="cline" x="204.0" y="333.5" text-anchor="middle">malformed calls rise within steps</text><rect class="card-accent" x="434.0" y="298.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="326.0" text-anchor="middle"><tspan class="ctitle">replay the step at lr / 10</tspan></text><rect class="card" x="834.0" y="298.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="318.5" text-anchor="middle"><tspan class="ctitle">(7) learning rate too high</tspan></text><text class="cline" x="995.0" y="333.5" text-anchor="middle">or too many epochs per batch</text><path class="track" d="M388.0,322.0 L428.0,322.0"/><path class="track" d="M421.7,325.0 L428.0,322.0 L421.7,319.0"/><path class="track" d="M768.0,322.0 L828.0,322.0"/><path class="track" d="M821.7,325.0 L828.0,322.0 L821.7,319.0"/><rect class="card-soft" x="24.0" y="360.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="380.5" text-anchor="middle"><tspan class="ctitle">entropy -&gt; 0 at low reward</tspan></text><text class="cline" x="204.0" y="395.5" text-anchor="middle">zero_adv_frac -&gt; 1, reads vanish</text><rect class="card-accent" x="434.0" y="360.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="388.0" text-anchor="middle"><tspan class="ctitle">regularizer signs; pass@k; temperature</tspan></text><rect class="card" x="834.0" y="360.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="380.5" text-anchor="middle"><tspan class="ctitle">(3) entropy collapse</tspan></text><text class="cline" x="995.0" y="395.5" text-anchor="middle">exploration is gone before the skill</text><path class="track" d="M388.0,384.0 L428.0,384.0"/><path class="track" d="M421.7,387.0 L428.0,384.0 L421.7,381.0"/><path class="track" d="M768.0,384.0 L828.0,384.0"/><path class="track" d="M821.7,387.0 L828.0,384.0 L821.7,381.0"/><rect class="card-soft" x="24.0" y="422.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="442.5" text-anchor="middle"><tspan class="ctitle">failing episodes get longer</tspan></text><text class="cline" x="204.0" y="457.5" text-anchor="middle">turns rise, reward unchanged</text><rect class="card-accent" x="434.0" y="422.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="450.0" text-anchor="middle"><tspan class="ctitle">length by outcome; aggregation mode</tspan></text><rect class="card" x="834.0" y="422.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="442.5" text-anchor="middle"><tspan class="ctitle">(4) length bias</tspan></text><text class="cline" x="995.0" y="457.5" text-anchor="middle">seq_mean_token_mean, step rewards</text><path class="track" d="M388.0,446.0 L428.0,446.0"/><path class="track" d="M421.7,449.0 L428.0,446.0 L421.7,443.0"/><path class="track" d="M768.0,446.0 L828.0,446.0"/><path class="track" d="M821.7,449.0 L828.0,446.0 L821.7,443.0"/><rect class="card-soft" x="24.0" y="484.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="504.5" text-anchor="middle"><tspan class="ctitle">reward up, held-out hidden down</tspan></text><text class="cline" x="204.0" y="519.5" text-anchor="middle">behavior shifts to one op</text><rect class="card-accent" x="434.0" y="484.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="512.0" text-anchor="middle"><tspan class="ctitle">independent verifier; exploit share</tspan></text><rect class="card" x="834.0" y="484.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="504.5" text-anchor="middle"><tspan class="ctitle">(6) reward hacking</tspan></text><text class="cline" x="995.0" y="519.5" text-anchor="middle">reward measures the wrong thing (Ch. 11)</text><path class="track" d="M388.0,508.0 L428.0,508.0"/><path class="track" d="M421.7,511.0 L428.0,508.0 L421.7,505.0"/><path class="track" d="M768.0,508.0 L828.0,508.0"/><path class="track" d="M821.7,511.0 L828.0,508.0 L821.7,505.0"/><rect class="card-soft" x="24.0" y="546.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="566.5" text-anchor="middle"><tspan class="ctitle">kl_ref = 0 with kl_coef &gt; 0</tspan></text><text class="cline" x="204.0" y="581.5" text-anchor="middle">run identical to one without KL</text><rect class="card-accent" x="434.0" y="546.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="574.0" text-anchor="middle"><tspan class="ctitle">KL to reference &gt; 0 after a step</tspan></text><rect class="card" x="834.0" y="546.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="566.5" text-anchor="middle"><tspan class="ctitle">(10) reference = policy</tspan></text><text class="cline" x="995.0" y="581.5" text-anchor="middle">missing deep copy or frozen copy</text><path class="track" d="M388.0,570.0 L428.0,570.0"/><path class="track" d="M421.7,573.0 L428.0,570.0 L421.7,567.0"/><path class="track" d="M768.0,570.0 L828.0,570.0"/><path class="track" d="M821.7,573.0 L828.0,570.0 L821.7,567.0"/><rect class="card-soft" x="24.0" y="608.0" width="360.0" height="48.0" rx="8"></rect><text x="204.0" y="628.5" text-anchor="middle"><tspan class="ctitle">nothing visible on the dashboard</tspan></text><text class="cline" x="204.0" y="643.5" text-anchor="middle">results change with microbatching</text><rect class="card-accent" x="434.0" y="608.0" width="330.0" height="48.0" rx="8"></rect><text x="599.0" y="636.0" text-anchor="middle"><tspan class="ctitle">accumulated = one-pass gradient</tspan></text><rect class="card" x="834.0" y="608.0" width="322.0" height="48.0" rx="8"></rect><text x="995.0" y="628.5" text-anchor="middle"><tspan class="ctitle">(8) accumulation normalizer</tspan></text><text class="cline" x="995.0" y="643.5" text-anchor="middle">and loss invariant to padding</text><path class="track" d="M388.0,632.0 L428.0,632.0"/><path class="track" d="M421.7,635.0 L428.0,632.0 L421.7,629.0"/><path class="track" d="M768.0,632.0 L828.0,632.0"/><path class="track" d="M821.7,635.0 L828.0,632.0 L821.7,629.0"/></svg>